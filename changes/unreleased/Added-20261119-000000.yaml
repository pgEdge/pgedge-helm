kind: Added
body: Added opt-in support for Spock 6.0 (beta) images such as `18-spock6-standard`, including upgrades from Spock 5.0.x by changing the image; Spock 5 stays the default. A new `pgEdge.nativeSlotSync` value (`auto` by default) turns on CloudNativePG's logical decoding slot synchronization for Spock 6.0 on PostgreSQL 18, so Spock slots survive a failover. The init-spock job now waits for the Spock extension to match its binaries, sets the `failover` flag on Spock slots on PostgreSQL 17 and later (existing slots on Spock 6.0 nodes, and the slots it creates for new nodes), fails if a node with standbys needs native slot sync but doesn't have it, rejects adding a node with a different Spock major version, and warns about `spock.pg_standby_slot_names` entries without a slot. See "Using Spock 6.0" in the docs
