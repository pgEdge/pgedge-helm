kind: Added
body: Added support for Spock 5.0.14 (PostgreSQL 16.16, 17.12, and 18.7). The chart now sets `spock.failover_slots_database` to the Spock database by default, and documents that a standby should only be promoted once its Spock slot copies are permanent
