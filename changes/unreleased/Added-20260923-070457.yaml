kind: Added
body: Added support for Spock 6 preview images (e.g. `18-spock6-standard`), including correct add-node peer catchup, failover-aware replication slots, and Spock version-mismatch validation. See `docs/usage/standby.md` and `docs/usage/adding_nodes.md` for details.
