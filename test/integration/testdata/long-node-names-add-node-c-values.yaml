pgEdge:
  appName: pgedge
  nodes:
    - name: node-a
      ordinal: 1
      hostname: pgedge-node-a-rw
    - name: node-b
      ordinal: 2
      hostname: pgedge-node-b-rw
    - name: node-c
      ordinal: 3
      hostname: pgedge-node-c-rw
      bootstrap:
        mode: spock
        sourceNode: node-a
  clusterSpec:
    storage:
      size: 1Gi
