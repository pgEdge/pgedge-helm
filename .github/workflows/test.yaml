name: Tests

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

env:
  TEST_POSTGRES_IMAGE: ghcr.io/pgedge/pgedge-postgres:18-spock5-standard
  TEST_POSTGRES_IMAGE_SPOCK6: ghcr.io/pgedge/pgedge-postgres:18-spock6-standard

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.22'
          cache-dependency-path: test/go.sum

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.17.0

      - name: Set up chart-testing
        uses: helm/chart-testing-action@e6669bcd63d7cb57cb4380c33043eebe5d111992 # v2

      - name: Chart lint
        run: ct lint --chart-dirs . --charts .

      - name: Unit tests
        run: make test-unit

  chart-testing:
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        spock: [spock5, spock6]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.17.0

      - name: Set up chart-testing
        uses: helm/chart-testing-action@e6669bcd63d7cb57cb4380c33043eebe5d111992 # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build pgedge-helm-utils dev image
        run: make docker-build-dev

      - name: Install Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.27.0
          install_only: true
          ignore_failed_clean: true

      - name: Create Kind cluster and install prerequisites
        run: make -C test kind-up

      - name: Load image into Kind
        run: make -C test kind-load-image

      - name: Select Postgres image for ${{ matrix.spock }}
        run: |
          if [ "${{ matrix.spock }}" = "spock6" ]; then
            echo "POSTGRES_IMAGE=${{ env.TEST_POSTGRES_IMAGE_SPOCK6 }}" >> "$GITHUB_ENV"
          else
            echo "POSTGRES_IMAGE=${{ env.TEST_POSTGRES_IMAGE }}" >> "$GITHUB_ENV"
          fi

      - name: Chart install test
        run: ct install --chart-dirs . --charts . --target-branch main --skip-missing-values --github-groups --helm-extra-set-args "--set pgEdge.initSpockImageName=pgedge-helm-utils:dev --set pgEdge.clusterSpec.imageName=${{ env.POSTGRES_IMAGE }}"

      - name: Teardown
        if: always()
        run: make -C test kind-down

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      # Split into groups so each job creates only a handful of Kind/CNPG
      # clusters instead of running the whole suite (~15 clusters)
      # sequentially in one job — that cumulative load was causing
      # unrelated, intermittent CNPG readiness-probe flakiness under
      # GitHub-hosted runner resource contention.
      matrix:
        include:
          - spock: spock5
            group: install
            run_tests: 'TestDistributedInstall|TestSingleNodeInstall|TestCustomDatabaseInstall'
            skip_tests: ''
          - spock: spock5
            group: install-ha
            run_tests: 'TestDistributedHAInstall|TestMultiClusterInstall'
            skip_tests: ''
          - spock: spock5
            group: nodes
            run_tests: 'TestNodes'
            skip_tests: ''
          - spock: spock5
            group: recovery
            run_tests: 'TestSlotLoss|TestOrphanSlot|TestResetSpock|TestIdempotent'
            skip_tests: ''
          - spock: spock5
            group: failover
            run_tests: 'TestUnplannedFailover'
            skip_tests: ''
          - spock: spock6
            group: install
            run_tests: 'TestDistributedInstall|TestSingleNodeInstall|TestCustomDatabaseInstall'
            # Intermittently stalls on spock6 (unconfirmed cause).
            skip_tests: 'TestDistributedInstall/data_replicates/active_active_n1'
          - spock: spock6
            group: install-ha
            run_tests: 'TestDistributedHAInstall|TestMultiClusterInstall'
            # Intermittently stalls on spock6 (unconfirmed cause).
            skip_tests: 'TestMultiClusterInstall/data_replicates_cross_namespace/b_to_a'
          - spock: spock6
            group: nodes
            run_tests: 'TestNodes'
            # TestNodesAddNodeZeroDowntime hits SPOC-648: spock.get_lsn_from_commit_ts().
            # Remove this skip once a preview image with the fix ships.
            skip_tests: 'TestNodesAddNodeZeroDowntime'
          - spock: spock6
            group: recovery
            run_tests: 'TestSlotLoss|TestOrphanSlot|TestResetSpock|TestIdempotent'
            # Intermittently stall on spock6 (unconfirmed cause).
            skip_tests: 'TestResetSpock/replication_works_after_reset|TestIdempotentReconciliation/replication_still_works'
          # spock6/failover is omitted: TestUnplannedFailover is its only
          # test, and it's entirely skipped for spock6 — the standby's
          # Spock slot syncs correctly before the failover, but still goes
          # inactive after promotion. This is a Postgres/Spock-internal race
          # (catalog xmin), untracked upstream as of this writing, not
          # something this chart's configuration can work around. See
          # docs/usage/standby.md.
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.22'
          cache-dependency-path: test/go.sum

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build pgedge-helm-utils dev image
        run: make docker-build-dev

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.17.0

      - name: Install Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.27.0
          install_only: true
          ignore_failed_clean: true

      - name: Create Kind cluster and install prerequisites
        run: make -C test kind-up

      - name: Load image into Kind
        run: make -C test kind-load-image

      - name: Select Postgres image for ${{ matrix.spock }}
        run: |
          if [ "${{ matrix.spock }}" = "spock6" ]; then
            echo "POSTGRES_IMAGE=${{ env.TEST_POSTGRES_IMAGE_SPOCK6 }}" >> "$GITHUB_ENV"
          else
            echo "POSTGRES_IMAGE=${{ env.TEST_POSTGRES_IMAGE }}" >> "$GITHUB_ENV"
          fi

      - name: Integration tests
        run: make -C test test-integration KUBECONTEXT=kind-pgedge-test INIT_SPOCK_IMAGE=pgedge-helm-utils:dev POSTGRES_IMAGE=${{ env.POSTGRES_IMAGE }} RUN_TESTS="${{ matrix.run_tests }}" SKIP_TESTS="${{ matrix.skip_tests }}" TIMEOUT=15m

      - name: Collect debug artifacts on failure
        if: failure()
        run: |
          mkdir -p /tmp/artifacts

          kind export logs /tmp/artifacts/kind-logs --name pgedge-test || true

          kubectl get pods -A -o wide > /tmp/artifacts/pods.txt || true
          kubectl get events -A --sort-by='.lastTimestamp' > /tmp/artifacts/events.txt || true

          helm list -A > /tmp/artifacts/helm-releases.txt || true
          helm get all pgedge -n default > /tmp/artifacts/helm-release-details.txt || true

          kubectl get jobs -n default > /tmp/artifacts/jobs.txt || true
          kubectl describe job pgedge-init-spock -n default > /tmp/artifacts/init-spock-job.txt || true
          kubectl logs -l job-name=pgedge-init-spock -n default --all-containers=true > /tmp/artifacts/init-spock-logs.txt || true

          kubectl get clusters.postgresql.cnpg.io -n default > /tmp/artifacts/pg-clusters.txt || true
          kubectl describe clusters.postgresql.cnpg.io -n default > /tmp/artifacts/pg-cluster-details.txt || true
          kubectl logs -l cnpg.io/cluster -n default --all-containers=true --tail=500 > /tmp/artifacts/postgres-logs.txt || true

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-logs-${{ matrix.spock }}-${{ matrix.group }}
          path: /tmp/artifacts

      - name: Teardown
        if: always()
        run: make -C test kind-down
