{{- $ := . -}}
{{- $defaults := .Values.pgEdge.clusterSpec -}}
{{- $total := len .Values.pgEdge.nodes -}}

{{- range $i, $node := .Values.pgEdge.nodes }}
{{- $spec    := (default dict $node.clusterSpec) -}}
{{- $merged  := mergeOverwrite (deepCopy $defaults) $spec -}}

{{- /* derive ordinal */ -}}
{{- $ord := "" -}}
{{- if hasKey $node "ordinal" -}}
  {{- $ord = $node.ordinal -}}
{{- else -}}
  {{- $ord = (trimPrefix "n" $node.name) -}}
{{- end -}}
{{- $ordStr := printf "%v" $ord -}}

{{- /* ensure postgresql.parameters exists */ -}}
{{- if not (hasKey $merged "postgresql") -}}
  {{- $_ := set $merged "postgresql" (dict) -}}
{{- end -}}
{{- if not (hasKey $merged.postgresql "parameters") -}}
  {{- $_ := set $merged.postgresql "parameters" (dict) -}}
{{- end -}}

{{- /* inject node-specific params */ -}}
{{- $_ := set $merged.postgresql.parameters "snowflake.node" $ordStr -}}
{{- $_ := set $merged.postgresql.parameters "lolor.node" $ordStr -}}

{{- /*
Standby instances need Postgres's native logical-slot sync (PG17+) for
Spock's replication slots to survive a promotion — without it a promoted
standby has no Spock slot and replication breaks. Only relevant when this
node actually has standbys; skip it for the common single-instance case,
and never override a value the user set explicitly.
*/ -}}
{{- if gt (int $merged.instances) 1 }}
  {{- if not (hasKey $merged.postgresql.parameters "sync_replication_slots") -}}
    {{- $_ := set $merged.postgresql.parameters "sync_replication_slots" "on" -}}
  {{- end -}}
  {{- if not (hasKey $merged "replicationSlots") -}}
    {{- $_ := set $merged "replicationSlots" (dict "highAvailability" (dict "synchronizeLogicalDecoding" true)) -}}
  {{- else if not (hasKey $merged.replicationSlots "highAvailability") -}}
    {{- $_ := set $merged.replicationSlots "highAvailability" (dict "synchronizeLogicalDecoding" true) -}}
  {{- else if not (hasKey $merged.replicationSlots.highAvailability "synchronizeLogicalDecoding") -}}
    {{- $_ := set $merged.replicationSlots.highAvailability "synchronizeLogicalDecoding" true -}}
  {{- end -}}
{{- end -}}

{{- if gt $i 0 }}
---
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ printf "%s-%s" $.Values.pgEdge.appName $node.name }}
  labels:
    pgedge.com/app-name: {{ printf "%s" $.Values.pgEdge.appName }}
spec:
  {{- toYaml $merged | nindent 2 }}
{{- end }}
