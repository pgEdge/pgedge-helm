{{- $ := . -}}
{{- $defaults := .Values.pgEdge.clusterSpec -}}
{{- $total := len .Values.pgEdge.nodes -}}

{{- range $i, $node := .Values.pgEdge.nodes }}
{{- $spec    := (default dict $node.clusterSpec) -}}
{{- $merged  := mergeOverwrite (deepCopy $defaults) $spec -}}

{{- /* derive ordinal */ -}}
{{- $ord := "" -}}
{{- if hasKey $node "ordinal" -}}
  {{- $ord = $node.ordinal -}}
{{- else -}}
  {{- $ord = (trimPrefix "n" $node.name) -}}
{{- end -}}
{{- $ordStr := printf "%v" $ord -}}

{{- /* ensure postgresql.parameters exists */ -}}
{{- if not (hasKey $merged "postgresql") -}}
  {{- $_ := set $merged "postgresql" (dict) -}}
{{- end -}}
{{- if not (hasKey $merged.postgresql "parameters") -}}
  {{- $_ := set $merged.postgresql "parameters" (dict) -}}
{{- end -}}

{{- /* inject node-specific params */ -}}
{{- $_ := set $merged.postgresql.parameters "snowflake.node" $ordStr -}}
{{- $_ := set $merged.postgresql.parameters "lolor.node" $ordStr -}}

{{- /* point Spock's failover slot worker (5.0.14+) at the Spock database,
       unless the user set spock.failover_slots_database explicitly. Use the
       chart-wide initdb database, which is the database init-spock
       configures on every node, so nodes bootstrapped with initdb: null
       (e.g. recovery) still get it */ -}}
{{- if not (hasKey $merged.postgresql.parameters "spock.failover_slots_database") -}}
  {{- $bootstrap := $defaults.bootstrap | default dict -}}
  {{- $initdb := $bootstrap.initdb | default dict -}}
  {{- $dbName := $initdb.database | default "" -}}
  {{- if $dbName -}}
    {{- $_ := set $merged.postgresql.parameters "spock.failover_slots_database" $dbName -}}
  {{- end -}}
{{- end -}}

{{- if gt $i 0 }}
---
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ printf "%s-%s" $.Values.pgEdge.appName $node.name }}
  labels:
    pgedge.com/app-name: {{ printf "%s" $.Values.pgEdge.appName }}
spec:
  {{- toYaml $merged | nindent 2 }}
{{- end }}
